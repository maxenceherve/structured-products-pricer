[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "structured-products-pricer"
version = "0.1.0.dev0"
description = "Pricing, Greeks and brick-by-brick decomposition of vanilla option strategies and structured products."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maxence Hervé", email = "maxence.herve@edhec.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]
keywords = [
    "black-scholes",
    "monte-carlo",
    "structured-products",
    "option-pricing",
    "greeks",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.24"]

[project.urls]
Repository = "https://github.com/maxenceherve/structured-products-pricer"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spricer"]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "NPY", # numpy-specific rules
    "PT",  # pytest style
    "RUF", # ruff-specific rules
    "D",   # docstrings (numpy convention, library code only)
]
# Greek letters are used on purpose in docstrings (sigma, rho, nu...).
allowed-confusables = ["σ", "ρ", "ν", "−", "×"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"app/**" = ["D"]

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "app"]

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = ["slow: long-running Monte Carlo tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["spricer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
