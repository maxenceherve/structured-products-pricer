[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "structured-products-pricer"
version = "0.1.0.dev0"
description = "Pricing, Greeks and brick-by-brick decomposition of vanilla option strategies and structured products."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maxence Hervé", email = "maxence.herve@edhec.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]
keywords = [
    "black-scholes",
    "monte-carlo",
    "structured-products",
    "option-pricing",
    "greeks",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.optional-dependencies]
app = ["streamlit>=1.60", "plotly>=5.24", "pandas>=2.2"]

[project.urls]
Repository = "https://github.com/maxenceherve/structured-products-pricer"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "scipy-stubs>=1.17.1.5",
    "quantlib>=1.34", # independent reference in tests only, never imported by the library
    "pandas-stubs>=3.0.5.260914",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
    "ipykernel>=7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spricer"]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "NPY", # numpy-specific rules
    "PT",  # pytest style
    "RUF", # ruff-specific rules
    "D",   # docstrings (numpy convention, library code only)
]
ignore = [
    "D105", # magic methods (__add__, __post_init__...) are self-explanatory
    "D401", # descriptive first lines ("Discount factor e^{-rT}.") read better for formulas
]
# Greek letters are used on purpose in docstrings (sigma, rho, nu...).
allowed-confusables = ["σ", "ρ", "ν", "−", "×"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"app/**" = ["D"]
"scripts/**" = ["D103"]
"notebooks/**" = ["D", "F401"]  # every notebook starts from the same setup cell

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "app"]
mypy_path = "app"  # Streamlit puts the entry script folder on sys.path

[[tool.mypy.overrides]]
module = ["plotly.*", "QuantLib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests: bodies are type-checked, but test functions and helpers need no annotations.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = ["slow: long-running Monte Carlo tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["spricer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
