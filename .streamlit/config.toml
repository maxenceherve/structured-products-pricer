[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6fa"
textColor = "#1b2333"
linkColor = "#1f4e79"
borderColor = "#dde3ec"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
headingFontWeights = [700, 650, 600]
metricValueFontWeight = 600
greenColor = "#1a9850"
redColor = "#d73027"
blueColor = "#1f4e79"
dataframeHeaderBackgroundColor = "#eef2f8"
chartCategoricalColors = ["#1f4e79", "#1a9850", "#d73027", "#f46d43", "#2c7fb8", "#7f7f7f"]

[theme.sidebar]
backgroundColor = "#f3f6fa"
